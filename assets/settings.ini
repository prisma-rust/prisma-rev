; PrismaRev 项目配置（INI 方言见 docs/DESIGN.md §「项目配置文件」）。
; 注意：行内不解析注释；值为空/写坏时回到默认值并 warn。

[app]
company = "Excurs1ons"
name = "PrismaRev"
version = "0.1.0"

[build]
; lib_name: Android 的 .so 名字（`lib<lib_name>.so` 与 `android.app.lib_name`）。
; 只有打包脚本用；不写时按 Cargo.toml 的库名推断（#598）。
lib_name = prisma
output_dir = "build/windows"
profile = "release"
run_after = false
target = "windows"

[render]
; internal_resolution: 内部渲染分辨率（#613）。off / 留空 = 按窗口分辨率渲染；
; 例如 640x360 时场景按该尺寸渲染，再放大到窗口（UI 仍按窗口尺寸）。
internal_resolution = off
; internal_scale_mode: stretch = 铺满窗口；integer = 最大整数倍 + 居中黑边。
internal_scale_mode = stretch
; aa_mode: 0 = 关（默认），1 = FXAA 后处理抗锯齿。
aa_mode = 0
; contrast / saturation / vignette: 后处理调色（#502）。
; contrast = 1.0 不变；saturation = 1.0 不变（0 = 灰度）；vignette = 0.0 关闭（1 = 四角全黑）。
contrast = 1.0
saturation = 1.0
vignette = 0.0
bloom = false
bloom_intensity = 0.15
bloom_threshold = 1.0
; chromatic_aberration: 镜头色差强度（#502 Phase 2）；0 = 关闭，1 = 最强。
chromatic_aberration = 0.0
; film_grain: 胶片颗粒强度（#502 Phase 2）；0 = 关闭，1 = 最强。
film_grain = 0.0
; temperature / tint: 白平衡（#502）；-1..1，0 = 中性。
; temperature < 0 偏冷（蓝），> 0 偏暖（橙）；tint < 0 偏绿，> 0 偏品红。
temperature = 0.0
tint = 0.0
; dof_focus_distance / dof_aperture / dof_max_blur: 深度景深（#502 Phase 2）。
; aperture = 0 关闭；对焦距离单位米；max_blur 是最大模糊半径（像素）。
dof_focus_distance = 1.0
dof_aperture = 0.0
dof_max_blur = 8.0
; lut / lut_strength: 3D 调色 LUT（#502），路径相对 assets/，支持 .cube 文件。
; 空 = 不使用；strength 0 = 关闭，1 = 完全使用（恒等 LUT + 1 与不启用一致）。
lut =
lut_strength = 0.0
; motion_blur / motion_blur_max_pixels: 相机运动模糊（#502 Phase 2）。
; motion_blur = 0 关闭；max_pixels 限制拖影长度，防止快速转镜头拉满全屏。
motion_blur = 0.0
motion_blur_max_pixels = 16.0
; taa / taa_strength: 时域抗锯齿（#883）。默认关闭；开启后相机做亚像素抖动，
; 用上一帧历史和深度重投影；strength 是历史权重（0–0.95）。
taa = false
taa_strength = 0.9
; shadow_distance: 主方向光阴影覆盖距离（米，#526）。
; 盒子以相机前方一半距离为中心、边长 = 这个值；2048² 贴图下 60 米 ≈ 2.9 cm/texel。
; 没有级联，所以这是「阴影能投多远」与「精度」的取舍。
shadow_distance = 60.0
; shadow_cascade_count: 1 = 单张阴影图（默认），2 = 近/远两级联 atlas（#526）。
shadow_cascade_count = 1
debug_flags = 0
debug_rt = 0
; wireframe: true = 前向管线用线框画网格（#431）；设备不支持时自动退回填充。
wireframe = false
; shaded_wireframe: true = 正常填充 + 线框叠加（#431）；wireframe 为 true 时以纯线框为准。
shaded_wireframe = false
pt_max_bounces = 3
pt_max_iterations = 0
pt_ray_max_distance = 1000.0
render_mode = "raster"
tonemap_mode = 0

[window]
fullscreen = false
height = 900
resizable = true
title = "PrismaRev"
vsync = true
width = 1600
