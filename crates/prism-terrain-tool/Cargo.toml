[package]
name = "prism-terrain-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terrain tooling: procedural heightmap generator, erosion, heightmap export."

[lib]
name = "prism_terrain_tool"
path = "src/lib.rs"

[[bin]]
name = "prism-terrain-tool"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true, features = ["auto-color", "humantime", "regex"] }
clap = { workspace = true }
# 地形高度图导出 PNG，以及 EXR（`Rgba32F` 高度场）。
image = { workspace = true, features = ["png", "exr"] }
rayon = { workspace = true }
rand = { workspace = true }
xxhash-rust = { workspace = true }
