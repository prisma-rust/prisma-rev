[package]
name = "prism-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application layer and main loop for PrismaRev"

[features]
default = ["pathtrace", "ui", "ui-fontdue", "ibl", "skybox", "shadows", "gtao", "group-3d", "group-2d", "group-ui"]
legacy-disk-scenes = []
# Lego 开关：透传到 prism-render（见 docs/DESIGN.md §12）。
pathtrace = ["prism-render/pathtrace"]
ui = ["prism-render/ui"]
# 文本光栅后端（透传）：默认 fontdue；Windows 可选系统 DirectWrite。
ui-fontdue = ["prism-render/ui-fontdue"]
ui-directwrite = ["prism-render/ui-directwrite"]
ibl = ["prism-render/ibl"]
skybox = ["prism-render/skybox"]
shadows = ["prism-render/shadows"]
gtao = ["prism-render/gtao"]
# 组件分组（透传 prism-scene）：关掉一组 = 该组组件不注册、serde 代码不链接。
group-3d = ["prism-scene/group-3d"]
group-2d = ["prism-scene/group-2d"]
group-ui = ["prism-scene/group-ui"]
# ECS 音频集成（`AudioSource` + `sync_audio_sources`）。默认关：整条 cpal /
# firewheel / symphonia 链路（约 30 个 crate）只在需要声音的项目里开。
audio = ["dep:prism-audio"]

[dependencies]
prism-ecs = { path = "../prism-ecs" }
# ABI 快照类型（`InputSnapshot`）。纯数据 crate、无依赖；引擎每帧把它写进
# World resource，静态 Player 的 `GameWorld::input()` 因此有真实输入（#589）。
prism-project-api = { path = "../prism-project-api" }
prism-reflect = { path = "../prism-reflect" }
# 必须 default-features = false：否则组件组开关会被 prism-scene 的默认特性重新打开。
prism-scene = { path = "../prism-scene", default-features = false }
prism-render = { path = "../prism-render", default-features = false }
prism-asset = { path = "../prism-asset", default-features = false, features = ["runtime"] }
prism-anim = { path = "../prism-anim" }

prism-audio = { path = "../prism-audio", optional = true }
glam.workspace = true
log = { workspace = true }
anyhow = { workspace = true }
rustc-hash = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dirs = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
# Match the same backend winit uses (see prism-android/Cargo.toml). The
# `game-activity` feature selects the GameActivity backend; without it
# android-activity won't compile.
android-activity = { version = "0.6", features = ["game-activity"] }
log = { workspace = true }

[dev-dependencies]
jni = "0.22"
