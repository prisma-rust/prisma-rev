[workspace]
resolver = "2"
members = [
    "crates/prism-ecs",
    "crates/prism-reflect",
    "crates/prism-reflect-derive",
    "crates/prism-gfx",
    "crates/prism-cooker",
    "crates/prism-scene",
    "crates/prism-render",
    "crates/prism-engine",
    "crates/prism-app",
    "crates/prism-game-api",
    "crates/prism-project-api",
    "crates/prism-runtime-host",
    "crates/prism-platform",
    "crates/prism-editor-tool",
    "crates/prism-editor-api",
    "crates/prism-editor-mcp",
    "crates/prism-build-pipeline",
    "crates/prism-audio",
    "crates/prism-asset",
    "crates/prism-anim",
]
# xtask (Slang reflection -> Rust binding codegen) is a build-time tool run only
# on desktop/CI hosts that have slangc. Excluded so it never enters the default
# workspace build (keeps Termux/Android `cargo check` free of its deps).
exclude = ["crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Vulkan
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"

# Window / events
# 平台后端由使用方显式选择（见 prism-platform 的 x11 / wayland feature）：
# Linux 上 winit 默认会把 X11 + Wayland 两套栈全编进来（~1 MB），
# Windows/Android 本来就只有系统库/NDK，不受影响。
winit = { version = "0.30", default-features = false, features = ["rwh_06", "android-game-activity"] }

# Maths
glam = { version = "0.33.2", features = ["serde"] }

# Physics (Rapier)
rapier3d = { version = "0.34", default-features = false, features = ["dim3", "f32", "std"] }

# Inter-thread communication
flume = "0.12.0"

# Logging
log = "0.4"
# 默认特性（含 `regex` 日志过滤，~0.47 MB）必须由使用方显式打开：
# 玩家运行时用不到正则，构建工具需要。见 docs/DESIGN.md §12.4。
env_logger = { version = "0.11", default-features = false }

# Error handling
anyhow = "1"

# Serialization / async / errors. These keys are shared with `prism-asset` and
# `prism-cooker` (members of this workspace); those crates declare the few they
# need locally (uuid, typetag, gltf, ...) and inherit the rest from here.
# Keep versions consistent if any are overridden in their Cargo.toml files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2.0.1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", features = ["experimental"] }
thiserror = "2.0.19"
clap = { version = "4", features = ["derive"] }
# 运行时的 image 依赖必须**零默认 codec**：每个 crate 只声明自己真正用到的格式。
#   - 玩家运行时（prism-render 截图）：png
#   - 构建期（prism-cooker 导入 / prism-editor-tool 导出）：各自的全部格式
# 这样 jpeg/tga/bmp/exr 的编解码器不会被打进玩家的二进制。
image = { version = "0.25", default-features = false }
dirs = "6.0.0"
unicode-width = "0.2"

# Windows API 绑定。目前只有 `prism-render/ui-directwrite`（DirectWrite 文本光栅）用，
# 而且只在 `cfg(windows)` 目标上作为 optional 依赖激活（见 prism-render/Cargo.toml）。
windows = "0.62"

# Asset / scene loading
# `gltf` crate version is the crate's release stream (1.4 = current), not the
# glTF spec version - the crate loads glTF 2.0 regardless of its own version.
gltf = { version = "1.4", features = ["KHR_materials_transmission", "KHR_materials_emissive_strength", "KHR_materials_ior", "extensions"] }
slotmap = "1.0"
rayon = "1.10"
rand = "0.10.2"

[profile.dev]
opt-level = 1          # ash/Vulkan has a lot of codegen; light opt keeps debug builds usable
# 本仓库 crate 保留行号表，足够定位 panic；完整 DWARF 会让 target/ 与 incremental 膨胀到数 GB。
debug = "line-tables-only"

# 依赖的调试信息基本用不上，去掉可再省一大截；本仓库 crate 仍保留行号。
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"

# 玩家 / Android 打包专用配置：体积优先，**不要用于编辑器**。
# `panic = "abort"` 会让进程内跑引擎的 editor 整体崩溃而不是让某个视口失败，
# 所以它不在 `release` 里，只在这个 profile 里。用法：`cargo build --profile dist`。
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
