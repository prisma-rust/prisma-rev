[package]
name = "prism-editor-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server exposing the PrismaRev editor data layer over stdio"

[[bin]]
name = "prism-editor-mcp"
path = "src/main.rs"

[dependencies]
prism-editor-api = { path = "../prism-editor-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true, features = ["auto-color", "humantime", "regex"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
