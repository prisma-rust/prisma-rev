[package]
name = "prism-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform application layer — owns the event loop, window, and frame orchestration"

[lib]
# rlib for desktop linking; Android `android_main` JNI entry lives in the
# user project's cdylib (see `run_android_app`), not here.
crate-type = ["lib"]

[features]
# 物理是**可选**能力。`physics_runner` 目前仍是骨架（独立线程 + step/result 通道），
# 尚未接进 `Engine::update`；不让它默认把 rapier3d / parry3d 拉进玩家二进制。
# 需要物理时在用户项目里开：`prism-app = { path = "...", features = ["physics"] }`。
default = ["pathtrace", "ui", "ui-fontdue", "ibl", "skybox", "shadows", "gtao", "winit-backend", "x11", "wayland", "group-3d", "group-2d", "group-ui"]
# 窗口后端二选一：
# - `winit-backend`（默认）：winit 窗口 + 事件循环（桌面 / Android）。
# - `win32-native`（默认关，仅 Windows）：Win32 原生窗口，**不编译任何 winit 代码**，
#   Windows 发布包因此省掉 winit 的体积。启用它请关掉 `winit-backend`。
# 两个都开时以 winit 为准（`win32-native` 被忽略），方便调试混搭。
winit-backend = ["dep:winit", "prism-platform/winit-backend"]
win32-native = ["prism-platform/win32-native"]
# Linux 上 winit 的子后端（透传 prism-platform）：体积敏感时只留一个。
# 它们**蕴含** `winit-backend`：`--no-default-features --features x11` 仍是
# 「只有 winit + X11」这个最小合法组合（`scripts/check_features.py` 依赖这条）。
x11 = ["winit-backend", "prism-platform/x11"]
wayland = ["winit-backend", "prism-platform/wayland"]
# Lego 开关：透传到 prism-render / prism-engine（见 docs/DESIGN.md §12）。
pathtrace = ["prism-render/pathtrace", "prism-engine/pathtrace"]
rtxgi = ["prism-render/rtxgi", "prism-engine/rtxgi", "pathtrace"]
nrc = ["prism-render/nrc", "prism-engine/nrc", "pathtrace"]
dlss = ["prism-render/dlss", "prism-engine/dlss"]
ui = ["prism-render/ui", "prism-engine/ui"]
# 文本光栅后端（透传到 prism-render，见 docs/DESIGN.md §12.2）。默认走 fontdue；
# Windows 发布包可以只要系统 DirectWrite（`ui-directwrite`），省掉 fontdue/ttf-parser。
ui-fontdue = ["prism-render/ui-fontdue"]
ui-directwrite = ["prism-render/ui-directwrite"]
ibl = ["prism-render/ibl", "prism-engine/ibl"]
skybox = ["prism-render/skybox", "prism-engine/skybox"]
shadows = ["prism-render/shadows", "prism-engine/shadows"]
gtao = ["prism-render/gtao", "prism-engine/gtao"]
group-3d = ["prism-engine/group-3d"]
group-2d = ["prism-engine/group-2d"]
group-ui = ["prism-engine/group-ui"]
physics = ["dep:rapier3d"]
# 音频后端（cpal + firewheel + symphonia，约 60 个 crate）。默认关：仓库里没有
# 任何地方真的在放声音（`Subsystem::Audio` 只是建引擎 + 解码线程）。需要声音的项目
# 打开这一个开关即可，它会连带启用 `prism-engine/audio`（ECS 侧的 `AudioSource`）。
audio = ["dep:prism-audio", "prism-engine/audio"]

[dependencies]
prism-engine = { path = "../prism-engine", default-features = false }
# `add_game_system` hands gameplay code the same `GameWorld` the preview module uses.
# `plugin` is not needed here: the player borrows the world directly.
prism-game-api = { path = "../prism-game-api", default-features = false, features = ["host"] }
prism-render = { path = "../prism-render", default-features = false }
prism-platform = { path = "../prism-platform", default-features = false }
prism-audio = { path = "../prism-audio", optional = true }
prism-asset = { path = "../prism-asset", default-features = false, features = ["core", "runtime"] }
glam.workspace = true
rapier3d = { workspace = true, optional = true }
flume.workspace = true

winit = { workspace = true, optional = true }
# 中立原始窗口句柄（winit 的 `raw_window_handle` 重导出就是这一份 crate）。
# 直接依赖它，`win32-native` 构建就不会因为 `use winit::raw_window_handle` 带进 winit。
raw-window-handle = { workspace = true }
log = { workspace = true }
# `regex` 只用于 RUST_LOG 的正则过滤（`env_filter` 的 `regex` feature），
# 默认开着一整套 regex 引擎（regex-automata + regex-syntax + aho-corasick ≈ 0.47 MB）。
# 我们只用 `module=level` 这种指令，子串匹配足够；需要正则的项目自行打开默认特性。
env_logger = { workspace = true, default-features = false, features = ["auto-color", "humantime"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# 默认特性 `regex` 只为 RUST_LOG 的正则过滤；Android 上它同样会拉进整套 regex 引擎。
android_logger = { version = "0.15", default-features = false }
ndk = "0.9"

[dev-dependencies]
# `examples/hosted_png.rs` 只写 PNG。
image = { workspace = true, features = ["png"] }
