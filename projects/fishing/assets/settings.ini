[app]
company = "PrismaRev"
name = "fishing"
version = "0.1.0"

[window]
title = "Cozy Fishing"
width = 1600
height = 900
resizable = true
fullscreen = false
vsync = true

[build]
; Android 打包用：libfishing.so / android.app.lib_name = fishing（#598）。
lib_name = fishing
target = "windows"
profile = "release"
output_dir = "build/windows"
run_after = false

[render]
# 2D pixel art: source colors are final, do not let Reinhard / ACES rewrite them.
tonemap_mode = 2
# Render the scene at the virtual resolution and upscale with integer scaling,
# so the pixel art stays crisp on any window size (#613).
internal_resolution = 640x360
internal_scale_mode = integer
