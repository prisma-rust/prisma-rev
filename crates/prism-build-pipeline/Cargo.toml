[package]
name = "prism-build-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline build pipeline: GI bake, asset cooking, etc."

[[bin]]
name = "prism-build-pipeline"
path = "src/main.rs"

[dependencies]
prism-ecs = { path = "../prism-ecs" }
prism-engine = { path = "../prism-engine" }
prism-render = { path = "../prism-render" }
prism-asset = { path = "../prism-asset", default-features = false, features = ["runtime"] }
prism-cooker = { path = "../prism-cooker", default-features = false }
prism-scene = { path = "../prism-scene" }
ash = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true, features = ["auto-color", "humantime", "regex"] }
clap = { workspace = true }
serde_json = { workspace = true }
rayon = "1"
rand = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
