[app]
company = "PrismaRev"
name = "prisma"
version = "0.1.0"

[window]
title = "PrismaRev"
width = 1600
height = 900
resizable = true
fullscreen = false
vsync = true

[build]
target = "windows"
profile = "release"
output_dir = "build/windows"
run_after = false

[render]
# 2D 像素画：源图颜色已经是最终颜色，不要被 Reinhard / ACES 改写。
tonemap_mode = 2
