[package]
name = "prism-game-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-independent gameplay API shared by the runtime host and project modules"

# 两个后端共用同一套函数签名：
# - `host`：直接借用宿主自己的 ECS World，零序列化（静态 Player / 宿主内）。
# - `plugin`：通过宿主下发的 C 函数表读写，组件以 RTTIBin 字节流跨边界。
# 插件构建只需 `--no-default-features --features plugin`。
[features]
default = ["host", "plugin"]
host = ["dep:prism-engine"]
plugin = []

[dependencies]
prism-reflect = { path = "../prism-reflect" }
prism-project-api = { path = "../prism-project-api" }
# 纯数据 ECS（无 Vulkan / 无 UI）。插件侧只用它的 `Entity` 句柄布局与
# `Component` blanket impl，永远不会把宿主的 `World` 指针传出去。
prism-ecs = { path = "../prism-ecs" }
# 仅 `host` 后端用于松散资产定位（插件构建不会拉进引擎）。
# **必须 default-features = false**：否则会把 prism-engine 的默认能力（如 `pathtrace`）
# 强加给每一个玩家，项目模板的 Lego 开关就失效了（#535 实测）。
prism-engine = { path = "../prism-engine", optional = true, default-features = false }
log.workspace = true

[dev-dependencies]
# 用真实的宿主函数表验证 plugin 后端，而不是在测试里仿造一张表。
prism-runtime-host = { path = "../prism-runtime-host" }
prism-scene = { path = "../prism-scene" }
# 测试里构造世界矩阵（`LocalToWorld`），与 prism-scene 用的是同一个 workspace 依赖。
glam.workspace = true
