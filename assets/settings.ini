; PrismaRev 项目配置（INI 方言见 docs/DESIGN.md §「项目配置文件」）。
; 注意：行内不解析注释；值为空/写坏时回到默认值并 warn。

[app]
company = "Excurs1ons"
name = "PrismaRev"
version = "0.1.0"

[build]
; lib_name: Android 的 .so 名字（`lib<lib_name>.so` 与 `android.app.lib_name`）。
; 只有打包脚本用；不写时按 Cargo.toml 的库名推断（#598）。
lib_name = prisma
output_dir = "build/windows"
profile = "release"
run_after = false
target = "windows"

[render]
; internal_resolution: 内部渲染分辨率（#613）。off / 留空 = 按窗口分辨率渲染；
; 例如 640x360 时场景按该尺寸渲染，再放大到窗口（UI 仍按窗口尺寸）。
internal_resolution = off
; internal_scale_mode: stretch = 铺满窗口；integer = 最大整数倍 + 居中黑边。
internal_scale_mode = stretch
; aa_mode: 0 = 关（默认），1 = FXAA 后处理抗锯齿。
aa_mode = 0
; contrast / saturation / vignette: 后处理调色（#502）。
; contrast = 1.0 不变；saturation = 1.0 不变（0 = 灰度）；vignette = 0.0 关闭（1 = 四角全黑）。
contrast = 1.0
saturation = 1.0
vignette = 0.0
; shadow_distance: 主方向光阴影覆盖距离（米，#526）。
; 盒子以相机前方一半距离为中心、边长 = 这个值；2048² 贴图下 60 米 ≈ 2.9 cm/texel。
; 没有级联，所以这是「阴影能投多远」与「精度」的取舍。
shadow_distance = 60.0
debug_flags = 0
debug_rt = 0
; wireframe: true = 前向管线用线框画网格（#431）；设备不支持时自动退回填充。
wireframe = false
pt_max_bounces = 3
pt_max_iterations = 0
pt_ray_max_distance = 1000.0
render_mode = "raster"
tonemap_mode = 0

[window]
fullscreen = false
height = 900
resizable = true
title = "PrismaRev"
vsync = true
width = 1600
