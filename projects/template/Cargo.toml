[package]
name = "template"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PrismaRev 用户游戏项目（模板工程）——桌面二进制 `template`，由 launcher/ spawn"

# 独立 workspace（仿 launcher/ 先例），不挂根 PrismaRev workspace。
[workspace]

# 桌面二进制是 `template`；Android / 编辑器用的是同一个 cdylib，但**库名单独取**
# `template_core`——lib 和 bin 同名时两边会抢同一个 `template.pdb`（MSVC 直接报冲突），
# 共用 target 目录时也会互相覆盖产物。`android.app.lib_name`（launcher gen/android
# Manifest）必须等于 `[build] lib_name` / 这里的库名。
# `lib` 类型供桌面 bin 链接 rlib；`cdylib` 另有两个用途：
# Android 的 GameActivity 入口，以及编辑器加载的 preview 模块。
[lib]
name = "template_core"
crate-type = ["lib", "cdylib"]

# 两种构建形态，互相排斥：
# - `player`（默认）：静态 Player / Android，直接链接引擎。
# - `preview-module`：编辑器加载的 cdylib。**不链接引擎**，只依赖跨 ABI 的
#   `prism-game-api` / `prism-project-api`，否则 .so 里会带第二份引擎。
[features]
default = ["player", "winit-window"]
# 引擎/渲染能力（`player-core`）与**窗口后端**、**文本光栅后端**分开，
# 这样发布包能只留一个窗口后端、一个文本后端。
#
# 文本后端从 `player-core` 里拆出来：`fontdue`（全平台）与系统 `DirectWrite`（仅 Windows）
# 在 `prism-render` 里互斥，塞进 `player` 就没法在项目侧选 DirectWrite 了。
player-core = [
    "dep:prism-app",
    "dep:prism-engine",
    # `prism-game-api` 默认开 `host`（直接借用宿主 World），会拉进
    # `prism-engine`；preview-module 只能有 `plugin` 后端，否则 .so 里会带
    # 第二份引擎。host 只在静态 Player 组合里显式打开。
    "prism-game-api/host",
    "prism-app/pathtrace",
    "prism-app/ui",
    "prism-app/ibl",
    "prism-app/shadows",
    "prism-app/gtao",
    "prism-app/group-3d",
    "prism-app/group-2d",
    "prism-app/group-ui",
    "prism-engine/pathtrace",
    "prism-engine/ui",
    "prism-engine/ibl",
    "prism-engine/skybox",
    "prism-engine/shadows",
    "prism-engine/gtao",
    "prism-engine/group-3d",
    "prism-engine/group-2d",
    "prism-engine/group-ui",
]
# 「能出玩家二进制」的完整默认组合 = 能力 + fontdue 文本后端。
# 需要 Windows 系统文本时用 `player-core,ui-directwrite`（见下）。
player = ["player-core", "ui-fontdue"]
# 文本后端 A：fontdue + ttf-parser（全平台，默认）。
ui-fontdue = ["prism-app/ui-fontdue", "prism-engine/ui-fontdue"]
# 文本后端 B：Windows 系统 DirectWrite（省掉 fontdue/ttf-parser，约 60 KiB）。
# 用法：`cargo build --release --no-default-features --features ui-directwrite,win32-window`
ui-directwrite = [
    "player-core",
    "prism-app/ui-directwrite",
    "prism-engine/ui-directwrite",
]
# 桌面 / Android 的 winit 后端（默认）。
winit-window = ["prism-app/winit-backend", "prism-app/x11", "prism-app/wayland"]
# Windows 发布包：Win32 原生窗口，**不链接 winit**（省 ~300 KB）。
# 用法：`cargo build --release --no-default-features --features player,win32-window`
win32-window = ["prism-app/win32-native"]
# 组件 schema 必须与编辑器宿主**完全一致**：宿主用默认分组编译，
# 模块是独立 workspace、拿不到引擎的 feature 统一，所以这里显式打开
# 三组。少了任何一组，`ProjectModule::load` 的 schema fingerprint 校验
# 会直接拒绝模块（而且项目自己也无法编码 Style / SpriteRenderer 等组件）。
preview-module = [
    "dep:prism-project-api",
    "prism-scene/group-3d",
    "prism-scene/group-2d",
    "prism-scene/group-ui",
]

[[bin]]
name = "template"
path = "src/main.rs"
# 没有 `player-core` 时没有 `build_app`，所以 bin 也不应被构建。
required-features = ["player-core"]

[dependencies]
# `default-features = false`：窗口后端由本 crate 的 `winit-window` /
# `win32-window` 显式选择（Cargo feature 只能加不能减，所以这里不能走默认值）。
prism-app = { path = "../../crates/prism-app", optional = true, default-features = false }
# 必须 default-features = false：文本后端由本 crate 的 ui-fontdue / ui-directwrite
# 显式选择（Cargo feature 只能加不能减，否则 fontdue 永远进二进制）。
prism-engine = { path = "../../crates/prism-engine", optional = true, default-features = false }
prism-game-api = { path = "../../crates/prism-game-api", default-features = false, features = [
    "plugin",
] }
prism-project-api = { path = "../../crates/prism-project-api", optional = true }
# 纯数据层（组件 / UI schema），两种形态都需要。
prism-scene = { path = "../../crates/prism-scene", default-features = false }
keyframe = "1.1"
log = "0.4"

# 玩家 / Android 打包：体积优先（fat LTO + 单 codegen unit + abort + strip）。
# 编辑器/工具跑在引擎进程内，不能用这个 profile。
# 体积优先档：opt-level=z 关掉内联与循环展开，配合 scripts/build-dist.sh --size
# 使用（那里还会加 -C llvm-args=-inline-threshold=0、build-std 与 immediate-abort）。
# 竞赛/极限体积场景用；命热路径掉帧明显时可把关键 crate 覆盖回 3：
#   [profile.tiny.package.prism-engine]
#   opt-level = 3
[profile.tiny]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
