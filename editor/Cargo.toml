[workspace]
resolver = "2"
members = ["crates/prism-editor-egui", "crates/prism-editor-gpui-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
ash = { version = "0.38", default-features = false }
ash-window = "0.13"
egui = "0.33.3"
egui-phosphor = { version = "0.11", default-features = true }
# Fork pins the upstream fix for per-image present semaphores
# (VUID-vkQueueSubmit-pSignalSemaphores-00067, issue #581).
egui-ash = { git = "https://github.com/prisma-rust/egui-ash", rev = "6b390d3e8f48d3e7025a20b1b07b46373a960b8c", features = [
  "gpu-allocator",
] }
env_logger = "0.11"
glam = "0.33"
gpu-allocator = { version = "0.27", default-features = false, features = [
  "vulkan",
] }
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
