[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
description = "PrismaRev build tooling — Slang reflection -> Rust binding codegen"

[[bin]]
name = "shader-bindgen"
path = "src/shader_bindgen.rs"

[[bin]]
name = "shader-budget"
path = "src/shader_budget.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Standalone workspace root. `xtask` is excluded from the repo workspace, but
# when this checkout lives under `<repo>/.worktrees/<name>` (in-repo worktree)
# the parent manifest's `exclude = ["crates/xtask"]` no longer matches the path
# and cargo would resolve the *parent* workspace instead, failing with
# "current package believes it's in a workspace when it's not".
[workspace]
