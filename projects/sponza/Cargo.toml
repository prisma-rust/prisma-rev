[package]
name = "sponza"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Sponza path-tracing sample project"

[workspace]

# 产物名与 package 名一致：桌面二进制 `sponza` + Android cdylib `lib_sponza.so`
# （JNI `android_main` 在 src/lib.rs）。
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
prism-app = { path = "../../crates/prism-app" }
prism-engine = { path = "../../crates/prism-engine" }

# 玩家 / Android 打包：体积优先（fat LTO + 单 codegen unit + abort + strip）。
# 编辑器/工具跑在引擎进程内，不能用这个 profile。
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
