[package]
name = "prism-editor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PrismaRev 编辑器的数据层：dock 布局树、场景文档、schema、撤销栈、主题、日志"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Asset thumbnails (#982): decode only the formats the panel can preview.
image = { workspace = true, features = ["png"] }
glam = { workspace = true }
# `assets/settings.ini` 方言（与引擎 / editor-api 共用一份解析器）。
prism-ini = { path = "../../../crates/prism-ini" }
