[package]
name = "prism-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio subsystem for PrismaRev, built on Firewheel"

[dependencies]
firewheel = { version = "0.12", default-features = false, features = [
    "cpal", "symphonium", "sampler_node", "spatial_basic_node", "log"
] }

log.workspace = true
thiserror = "2"
symphonium = "0.12"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "ogg", "flac", "wav", "isomp4"
] }
