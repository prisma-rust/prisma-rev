[app]
company = "PrismaRev"
name = "echowell"
version = "0.1.0"

[window]
title = "EchoWell"
width = 1280
height = 720
resizable = true
fullscreen = false
vsync = true

[build]
lib_name = echowell_core
target = "windows"
profile = "release"
output_dir = "build/windows"
run_after = false

[render]
tonemap_mode = 2
internal_resolution = 320x180
internal_scale_mode = integer
