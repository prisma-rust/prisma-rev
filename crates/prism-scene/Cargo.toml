[package]
name = "prism-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scene schema, ECS scene components, and RSCN v4 codec for PrismaRev"

[features]
# Component groups (building blocks): disabling a group skips registration and serde/reflection code.
# 核心组（Active / Name / Transform / Camera / PrefabInstance）永远编译。
default = ["group-3d", "group-2d", "group-ui"]
group-3d = []
group-2d = []
group-ui = []

[dependencies]
prism-ecs = { path = "../prism-ecs" }
prism-physics2d = { path = "../prism-physics2d" }
prism-reflect = { path = "../prism-reflect" }
prism-gfx = { path = "../prism-gfx" }
# settings.ini dialect (shared with the legacy `scenes.toml` value reader).
prism-ini = { path = "../prism-ini" }
glam.workspace = true
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
