[package]
name = "prism-editor-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PrismaRev 的 egui 编辑器：经典布局 + Scene/Game 视口零拷贝"

[[bin]]
name = "prism-editor-egui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
ash = { workspace = true }
ash-window = { workspace = true }
egui = { workspace = true }
egui-phosphor = { workspace = true }
egui-ash = { workspace = true }
env_logger = { workspace = true }
glam = { workspace = true }
gpu-allocator = { workspace = true }
log = { workspace = true }
raw-window-handle = { workspace = true }
serde_json = { workspace = true }

prism-render = { path = "../../../crates/prism-render" }
prism-engine = { path = "../../../crates/prism-engine" }
# Project 面板的音频试听（#508）：与玩家共用同一套解码 / 混音器。
prism-audio = { path = "../../../crates/prism-audio" }
prism-scene = { path = "../../../crates/prism-scene" }
# Game View 的 Play 执行用户项目 gameplay 代码：同构建 ABI 的动态模块宿主。
prism-runtime-host = { path = "../../../crates/prism-runtime-host" }
# 数据层（UI 框架无关）：dock 布局、文档模型、schema、
# 撤销栈、日志缓冲、i18n、项目读写。
prism-editor-core = { package = "prism-editor-gpui-core", path = "../prism-editor-gpui-core" }
