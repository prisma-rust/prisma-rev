[app]
company = "PrismaRev"
name = "sponza"
version = "0.1.0"

[window]
title = "PrismaRev Sponza - RTXGI / NRC / DLSS Testbed"
width = 1920
height = 1080
resizable = true
fullscreen = false
vsync = false

[build]
lib_name = sponza
target = "windows"
profile = "release"
output_dir = "build/windows"
run_after = false

[render]
render_mode = "path_trace"
pt_max_bounces = 4
pt_max_iterations = 0
pt_ray_max_distance = 1000.0
tonemap_mode = 1
