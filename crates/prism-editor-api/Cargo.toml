[package]
name = "prism-editor-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Editor and MCP data layer: scene schema projection and .scene.json IO (UI-framework-free, Vulkan-free)"

[dependencies]
prism-scene = { path = "../prism-scene" }
prism-ini = { path = "../prism-ini" }
prism-asset = { path = "../prism-asset" }
prism-reflect = { path = "../prism-reflect" }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
prism-cooker = { path = "../prism-cooker" }
