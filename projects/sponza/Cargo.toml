[package]
name = "sponza"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Sponza path-tracing & RTXGI sample project"

[workspace]

[lib]
# The bin is `sponza` too; a matching lib name made both targets write
# `sponza.pdb` (Windows link error / PDB conflict). The lib crate is
# `sponza_core`, the executable stays `sponza`.
name = "sponza_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "sponza"
path = "src/main.rs"
required-features = ["player"]

[features]
default = ["player", "rtxgi"]
# 只负责「链接引擎」，**不**决定渲染能力：能力开关都写在自己的 feature 里，
# 否则 `--no-default-features --features player` 会悄悄把能力带回来。
player = [
    "dep:prism-app",
    "dep:prism-engine",
    "prism-game-api/host",
    # 引擎砖块逐条列，和 `projects/template` 的 `player-core` 保持一致：
    # 下面两个依赖都写了 `default-features = false`，不列就等于什么都不编。
    "prism-app/pathtrace",
    "prism-app/ui",
    "prism-app/ui-fontdue",
    "prism-app/ibl",
    "prism-app/shadows",
    "prism-app/gtao",
    "prism-app/winit-backend",
    "prism-app/x11",
    "prism-app/wayland",
    "prism-app/group-3d",
    "prism-app/group-2d",
    "prism-app/group-ui",
    "prism-engine/pathtrace",
    "prism-engine/ui",
    "prism-engine/ui-fontdue",
    "prism-engine/ibl",
    "prism-engine/skybox",
    "prism-engine/shadows",
    "prism-engine/gtao",
    "prism-engine/group-3d",
    "prism-engine/group-2d",
    "prism-engine/group-ui",
]
preview-module = [
    "dep:prism-project-api",
    "prism-game-api/plugin",
    "prism-scene/group-3d",
    "prism-scene/group-2d",
    "prism-scene/group-ui",
]
# NVIDIA RTXGI SHaRC（世界空间辐射缓存）。**默认开**：Sponza 的默认渲染路径就是
# 路径追踪 + SHaRC。关掉即回退到纯路径追踪：
#   cargo run --no-default-features --features player
rtxgi = ["prism-app/rtxgi", "prism-engine/rtxgi"]
nrc = ["prism-app/nrc", "prism-engine/nrc"]
dlss = ["prism-app/dlss", "prism-engine/dlss"]

[dependencies]
# 两个依赖都关掉默认特性：能力由上面的 `player` / `rtxgi` 显式列出。
# 开着默认特性时 Cargo 的「只能加不能减」会让 `--no-default-features --features player`
# 仍然把 `rtxgi` 带回来，开关等于没有。
prism-app = { path = "../../crates/prism-app", optional = true, default-features = false }
prism-engine = { path = "../../crates/prism-engine", optional = true, default-features = false }
prism-game-api = { path = "../../crates/prism-game-api", default-features = false }
prism-project-api = { path = "../../crates/prism-project-api", optional = true }
prism-platform = { path = "../../crates/prism-platform" }
prism-scene = { path = "../../crates/prism-scene", default-features = false }
log = "0.4"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
