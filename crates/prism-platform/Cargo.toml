[package]
name = "prism-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform abstraction — window system, Vulkan surface, input routing"

[features]
# Window backends (chosen explicitly; winit is no longer pulled in implicitly):
# - `winit-backend`: winit window + event loop for desktop / Android.
# - `win32-native`: Windows only; opens a window with the Win32 API directly and
#   does **not** link winit.
# On Linux, x11 / wayland are only winit sub-backend switches and are both on by
# default (either session can start); size-sensitive distributions can keep just
# one: `--no-default-features --features x11`.
default = ["winit-backend", "x11", "wayland"]
winit-backend = ["dep:winit"]
x11 = ["winit-backend", "winit/x11"]
wayland = [
    "winit-backend",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita",
]
# Only takes effect on Windows (no winit). See the module docs in `src/win32.rs`.
win32-native = []

[dependencies]
winit = { workspace = true, optional = true }
ash-window = { workspace = true }
raw-window-handle = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Used only by `win32-native`; the signed constants and `GetMessageW` live here.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
